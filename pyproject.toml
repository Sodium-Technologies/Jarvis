[project]
name = "jarvis"
version = "0.1.0"
description = "A private, local-first AI assistant built on a locally hosted model (Ollama)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
